name: Reusable Lint Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        module: ['.', hostmock, function, httpclient, kv, logging, metrics, sql]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
