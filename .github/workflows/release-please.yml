name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  native:
    uses: ./.github/workflows/reusable-native.yml
    secrets: inherit

  standalone:
    uses: ./.github/workflows/reusable-standalone.yml

  lint:
    uses: ./.github/workflows/reusable-lint.yml

  tinygo-candidate:
    uses: ./.github/workflows/reusable-tinygo-candidate.yml

  release-please:
    needs: [native, standalone, lint, tinygo-candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          command: manifest
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
